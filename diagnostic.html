<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Nira Audit — Diagnostic de connexion</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap');
    *{box-sizing:border-box}

    /* L'attribut hidden doit l'emporter sur les display des classes (.btn, .auth-screen…) :
       sans cette règle, un élément masqué en JS reste affiché. */
    [hidden]{display:none!important}
    body{max-width:820px;margin:0 auto;padding:28px 18px 70px;background:#f8fcff;color:#102a43;font:13px/1.6 Manrope,Arial,sans-serif}
    .diag-brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
    .diag-brand img{width:36px;height:36px;border-radius:10px;object-fit:contain}
    .diag-brand b{font:800 15px Manrope;letter-spacing:-.05em}
    .diag-brand span{display:block;color:#627d98;font:500 9px 'DM Mono';letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0 0 6px;font-size:26px;letter-spacing:-.05em}
    p.intro{margin:0 0 22px;color:#627d98;font-size:12px}
    form{display:grid;gap:10px;margin-bottom:22px;padding:18px;border:1px solid rgba(89,129,169,.18);border-radius:16px;background:#fff}
    label{color:#627d98;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    input{width:100%;padding:11px 12px;border:1px solid rgba(89,129,169,.2);border-radius:10px;font:inherit}
    button{padding:12px;border:0;border-radius:10px;background:#006bdc;color:#fff;font:700 12px Manrope;cursor:pointer}
    button.ghost{background:#eef6ff;color:#0b4f9e}
    button:disabled{opacity:.6;cursor:wait}
    .step{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:12px 14px;margin-bottom:7px;border-radius:12px;background:#fff;border:1px solid rgba(89,129,169,.15)}
    .step b{display:block;font-size:12px}
    .step span{display:block;margin-top:3px;color:#627d98;font:500 11px/1.55 'DM Mono';word-break:break-word;white-space:pre-wrap}
    .ok{color:#18a67e}.ko{color:#e84d6a}.wait{color:#e99512}
    .mark{font-size:16px;text-align:center}
    .step.fail{border-color:rgba(232,77,106,.4);background:#fff6f8}
  </style>
    <style>
      /* ===================== Comportement d'application =====================
         Pas de zoom, pas de rebond élastique, pas de surlignage au toucher :
         l'ensemble doit se comporter comme une application installée. */
      html{height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
      body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
      button,a,.nav-btn,.segment,.icon-btn,.mini-btn,.account-btn{-webkit-touch-callout:none}
      @media (max-width: 820px) {
        /* Encoche et barre d'accueil : le contenu ne passe jamais dessous. */
        .app{
          padding-top:max(10px,env(safe-area-inset-top));
          padding-bottom:calc(58px + env(safe-area-inset-bottom));
          padding-left:env(safe-area-inset-left);
          padding-right:env(safe-area-inset-right);
        }
        .topbar{top:max(8px,env(safe-area-inset-top))}
        .toast{bottom:calc(14px + env(safe-area-inset-bottom))}
        /* Les commandes ne se sélectionnent pas au appui long ; les contenus, si. */
        .topbar,.nav,.nav-btn,.segmented,.segment,.btn,.account-btn,.brand,.wordmark{user-select:none!important;-webkit-user-select:none!important}
      }
    </style>
</head>
<body>
  <div class="diag-brand"><img src="/logo.png" alt="Nira Audit"><div><b>Nira Audit</b><span>Diagnostic</span></div></div>
  <h1>Diagnostic de connexion</h1>
  <p class="intro">Cette page déroule exactement les étapes que fait l’application, et affiche où ça casse. Rien n’est enregistré : les identifiants ne servent qu’à ce test, dans ton navigateur.</p>
  <form id="form">
    <div><label for="email">Email</label><input id="email" type="text" autocomplete="username" placeholder="prenom@nira-ia.com"></div>
    <div><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password"></div>
    <button type="submit" id="run">Lancer le diagnostic</button>
    <button type="button" class="ghost" id="copy">Copier le rapport</button>
  </form>
  <div id="steps"></div>
  <script type="module" src="/src/diagnostic.ts"></script>
  <script>
    // Safari applique encore le pincement dans un onglet : on le neutralise ici,
    // le reste (double-tape) est couvert par touch-action: manipulation.
    for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
      document.addEventListener(type, function (event) { event.preventDefault() }, { passive: false })
    }
  </script>
</body>
</html>
